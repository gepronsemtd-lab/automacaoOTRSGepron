name: Atualizar Dashboard OTRS SESUITE

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar Testes de Validação (Quality Gate)
        run: pytest tests/ -v
        # Se este passo falhar (ex: colunas vieram erradas do OTRS), 
        # o pipeline é abortado e a dashboard atual não é sobrescrita.
        
      - name: Gerar dashboard
        env:
          OTRS_USER: ${{ secrets.OTRS_USER }}
          OTRS_PASS: ${{ secrets.OTRS_PASS }}
        run: python main.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4